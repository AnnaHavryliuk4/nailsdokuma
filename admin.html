<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241713"><title>Nailsdokuma · Yorum yönetimi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap');
:root{--ink:#241713;--paper:#f8f4ef;--cream:#eee5dc;--rose:#db91a0;--rose-dark:#a95569;--muted:#8e7d74;--line:#dacdc3;--serif:'Bodoni Moda',Georgia,serif;--sans:'Manrope',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input{font:inherit}.top{height:4px;background:var(--rose)}header{background:#f8f4ef;border-bottom:1px solid #e9ded5;padding:15px clamp(18px,5vw,64px);display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font:500 29px var(--serif);text-decoration:none;letter-spacing:-1.5px}.brand i{font-style:normal;color:var(--rose-dark)}.head-actions{display:flex;align-items:center;gap:14px}.lang,.quiet{border:0;background:none;color:var(--ink);cursor:pointer;padding:9px}.wrap{max-width:1100px;margin:0 auto;padding:50px 22px 80px}.kicker{font-size:10px;letter-spacing:.2em;color:var(--rose-dark);text-transform:uppercase}h1{font:400 clamp(38px,6vw,66px)/1.08 var(--serif);margin:12px 0 8px}h1 span{color:var(--rose-dark)}.intro{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 30px}.panel{background:#fffdfa;border:1px solid var(--line);padding:clamp(20px,4vw,36px);box-shadow:0 12px 40px rgba(36,23,19,.04)}.auth-panel{max-width:480px;margin:20px auto}.form{display:grid;gap:12px}.form label{font-size:11px;letter-spacing:.08em;text-transform:uppercase}.form input{border:1px solid var(--line);background:var(--paper);padding:13px;color:var(--ink)}.button{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;text-transform:uppercase;letter-spacing:.1em;font-size:10px;cursor:pointer}.button:hover{background:var(--rose-dark);border-color:var(--rose-dark)}.button:disabled{opacity:.55;cursor:wait}.button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.message{min-height:22px;color:var(--rose-dark);font-size:12px;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tab{border:1px solid var(--line);background:transparent;padding:10px 14px;color:var(--ink);cursor:pointer;font-size:11px}.tab[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.review-list{display:grid;gap:14px}.review{border:1px solid var(--line);padding:20px;display:grid;grid-template-columns:1fr auto;gap:12px;background:#fffdfa}.review h2{font:600 15px var(--sans);margin:0 0 8px}.review p{white-space:pre-wrap;line-height:1.65;font-size:13px;margin:10px 0}.review-meta{color:var(--muted);font-size:10px;letter-spacing:.04em}.stars{color:var(--rose-dark);letter-spacing:.12em}.status{display:inline-block;margin-left:10px;padding:4px 7px;background:var(--cream);color:var(--ink);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.empty{font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:620px){header{align-items:flex-start}.brand{font-size:24px}.head-actions{gap:4px}.wrap{padding-top:34px}.review{grid-template-columns:1fr}.actions{justify-content:flex-start}}
</style>
</head>
<body><div class="top"></div><header><a class="brand" href="./index.html">Nailsdo<i>k</i>uma <span aria-hidden="true">♡</span></a><div class="head-actions"><button class="lang" id="language" type="button" aria-label="Dili değiştir"><b>TR</b> / UA</button><button class="quiet" id="sign-out" type="button" hidden data-tr="Çıkış yap" data-ua="Вийти">Çıkış yap</button></div></header><main class="wrap"><div class="kicker" data-tr="ÖZEL YÖNETİM ALANI" data-ua="ЗАХИЩЕНА ПАНЕЛЬ КЕРУВАННЯ">ÖZEL YÖNETİM ALANI</div><h1 data-tr="Yorum <span>yönetimi</span>" data-ua="Керування <span>відгуками</span>">Yorum <span>yönetimi</span></h1><p class="intro" data-tr="Yorumları inceleyin, yayınlanacak olanları onaylayın." data-ua="Переглядайте відгуки та схвалюйте ті, які можна опублікувати.">Yorumları inceleyin, yayınlanacak olanları onaylayın.</p><section class="panel auth-panel" id="login-panel"><form class="form" id="login-form"><label for="email" data-tr="E-posta" data-ua="Електронна пошта">E-posta</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password" data-tr="Şifre" data-ua="Пароль">Şifre</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button" id="login-button" type="submit" data-tr="Güvenli giriş" data-ua="Захищений вхід">Güvenli giriş</button><p class="message" id="login-message" role="status" aria-live="polite"></p></form></section><section id="dashboard" hidden><div class="toolbar" role="group" aria-label="Review status filters"><button class="tab" type="button" data-status="pending" aria-pressed="true" data-tr="Bekleyen" data-ua="Очікують">Bekleyen</button><button class="tab" type="button" data-status="approved" aria-pressed="false" data-tr="Onaylanan" data-ua="Схвалені">Onaylanan</button><button class="tab" type="button" data-status="rejected" aria-pressed="false" data-tr="Reddedilen" data-ua="Відхилені">Reddedilen</button></div><p id="dashboard-message" class="message" role="status" aria-live="polite"></p><div id="admin-review-list" class="review-list" aria-live="polite"></div></section></main><script src="./supabase-config.js"></script><script type="module" src="./admin.js"></script></body></html>
